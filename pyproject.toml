[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x-bookmarks-organizer"
version = "0.1.0"
description = "Organizador y clasificador inteligente de guardados de Twitter / X con IA y búsqueda FTS5"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Daniel Cossio" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
x-bookmarks = "app.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
